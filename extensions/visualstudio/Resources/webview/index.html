<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Report Designer</title>
    <style> html, body, #root { height: 100%; margin: 0; } </style>
    <!--
      The React bundle is produced by the vscode extension's webview build
      and copied here by a post-build step. See scripts/build-webview.ps1
      at the monorepo root.
    -->
    <link rel="stylesheet" href="./designer.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./designer.js"></script>
    <script>
      // WebView2 bridge shim — lets the same React bundle we ship in VS Code
      // (which uses window 'message' events + acquireVsCodeApi) run in WebView2.
      (function () {
        var wv = window.chrome && window.chrome.webview;
        // Host -> guest: PostWebMessageAsJson arrives on chrome.webview's
        // 'message' event. Re-dispatch it as a standard window 'message' event
        // so the React app's window.addEventListener("message", ...) receives
        // load / serialize / config / ai-result.
        if (wv && wv.addEventListener) {
          wv.addEventListener("message", function (e) {
            window.dispatchEvent(new MessageEvent("message", { data: e.data }));
          });
        }
        // Guest -> host: forward postMessage to the native WebView2 channel.
        window.acquireVsCodeApi = function () {
          return {
            postMessage: function (msg) { if (wv) wv.postMessage(msg); },
            setState: function () {},
            getState: function () { return null; },
          };
        };
      })();
    </script>
  </body>
</html>
